<!-- Define the document type as HTML5. -->
<!doctype html>

<!-- Start the HTML document and specify English as the language. -->
<html lang="en">

  <!-- Start the document head. -->
  <head>

    <!-- Configure the character encoding. -->
    <meta charset="UTF-8" />

    <!-- Configure the viewport for responsive layouts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Define the title displayed by the browser. -->
    <title>useInsertionEffect Example</title>

  <!-- End the document head. -->
  </head>

  <!-- Start the document body. -->
  <body>

    <!-- Create the DOM element where React will mount the application. -->
    <div id="root"></div>

    <!-- Load the React application's entry point as an ES module. -->
    <script type="module" src="/src/main.jsx"></script>

  <!-- End the document body. -->
  </body>

<!-- End the HTML document. -->
</html>
